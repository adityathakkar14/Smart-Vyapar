<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C5C"/>
      <stop offset="100%" stop-color="#092F39"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3722C"/>
      <stop offset="100%" stop-color="#E55B13"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#tealGrad)"/>

  <!-- Shopping Bag / POS Body -->
  <g filter="url(#dropShadow)">
    <!-- Bag Handle -->
    <path d="M 196 170 C 196 110, 316 110, 316 170" fill="none" stroke="url(#saffronGrad)" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Bag Main Container -->
    <rect x="120" y="170" width="272" height="260" rx="32" fill="#FFFFFF"/>
    
    <!-- Central Saffron Badge -->
    <circle cx="256" cy="300" r="70" fill="url(#saffronGrad)"/>
    
    <!-- Rupee / Invoice Symbol -->
    <path d="M 232 268 L 280 268 M 232 284 L 272 284 M 232 268 C 265 268, 265 310, 232 310 L 280 336" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Voice Soundwaves on Corner -->
    <path d="M 330 205 A 25 25 0 0 1 355 230" fill="none" stroke="#0F4C5C" stroke-width="10" stroke-linecap="round"/>
    <path d="M 345 190 A 45 45 0 0 1 380 235" fill="none" stroke="#0F4C5C" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
