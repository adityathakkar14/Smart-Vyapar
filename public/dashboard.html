<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Vyapar - Dashboard</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0F4C5C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SmartVyapar">
  <meta name="description" content="Business Analytics and Insights for Smart Vyapar POS">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Offline Status Banner -->
  <div id="offline-indicator" class="alert alert-warning py-1 px-3 mb-0 rounded-0 text-center small d-none" role="alert">
    <i class="bi bi-wifi-off me-1"></i> You are currently offline. Cached data is available.
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="d-flex justify-content-between align-items-center mb-1">
      <div class="flex-grow-1 text-center">
        <h1 class="mb-0">Analytics Dashboard</h1>
      </div>
    </div>
    <p class="mb-2">Business Insights</p>
    <button class="btn btn-sm btn-light text-teal fw-semibold btn-pwa-install d-none" id="btn-install-app">
      <i class="bi bi-download me-1 text-teal"></i> Install App
    </button>
  </header>

  <main class="container-fluid px-3">
    
    <!-- Loading State -->
    <div id="dashboard-loading" class="text-center my-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="text-muted mt-2">Loading your business data...</p>
    </div>

    <!-- Dashboard Content (hidden until loaded) -->
    <div id="dashboard-content" class="d-none">
      
      <!-- Today's Revenue Card -->
      <div class="card mb-4 text-center border-0" style="background: linear-gradient(135deg, var(--primary-teal), #1a6f85); color: white;">
        <div class="card-body py-4">
          <h5 class="card-title fw-normal opacity-75 mb-1">Today's Revenue</h5>
          <h2 class="display-5 fw-bold mb-0" id="today-revenue">₹0.00</h2>
        </div>
      </div>

      <!-- Revenue Trend Chart -->
      <div class="card mb-4">
        <div class="card-header">Revenue Trend (Last 7 Days)</div>
        <div class="card-body">
          <canvas id="revenueTrendChart" height="200"></canvas>
        </div>
      </div>

      <!-- Top Selling Items Chart -->
      <div class="card mb-4">
        <div class="card-header">Top Selling Items</div>
        <div class="card-body d-flex justify-content-center">
          <canvas id="topItemsChart" height="220"></canvas>
        </div>
      </div>

      <!-- Recent Invoices Table -->
      <div class="card mb-4">
        <div class="card-header">Recent Invoices</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>Inv #</th>
                  <th>Customer</th>
                  <th class="text-end">Amount</th>
                </tr>
              </thead>
              <tbody id="recent-invoices-tbody">
                <!-- Data populated via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Navigation -->
  <nav class="navbar fixed-bottom navbar-light bg-white border-top">
    <div class="container-fluid justify-content-around">
      <a href="index.html" class="nav-link text-muted d-flex flex-column align-items-center">
        <i class="bi bi-receipt fs-4"></i>
        <span class="small">Billing</span>
      </a>
      <a href="dashboard.html" class="nav-link text-primary d-flex flex-column align-items-center">
        <i class="bi bi-graph-up fs-4"></i>
        <span class="small">Dashboard</span>
      </a>
    </div>
  </nav>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- App JS -->
  <script src="js/pwa.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
